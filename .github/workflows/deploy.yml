# Збірка і публікація сайту на GitHub Pages.
# Запускається при кожному push у гілку main або вручну (Actions → «Deploy to GitHub Pages» → Run workflow).
# Базовий шлях береться з налаштувань Pages: для https://USERNAME.github.io/vita-teacher-day/ це "/vita-teacher-day/",
# для сайту користувача чи власного домену — "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import reviewed compositing update
        if: hashFiles('claude-animation-update.zip') != ''
        run: |
          echo '9b9913d1919020391af0e0981e0e6d01d575594b5aaab80e38f9f0b63e11f644  claude-animation-update.zip' | sha256sum --check
          unzip -q -o claude-animation-update.zip -d .
          git add -- src tools README.md package.json
          git rm -- src/scenes/SceneSvg.tsx claude-animation-update.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish composited animation layers and background scene preparation"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Check animation scheduling and scene transitions
        run: npm test

      - name: Build (TypeScript check + Vite)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
