# Збірка і публікація сайту на GitHub Pages.
# Запускається при кожному push у гілку main або вручну (Actions → «Deploy to GitHub Pages» → Run workflow).
# Базовий шлях береться з налаштувань Pages: для https://USERNAME.github.io/vita-teacher-day/ це "/vita-teacher-day/",
# для сайту користувача чи власного домену — "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import reviewed animation update
        shell: bash
        run: |
          set -euo pipefail
          echo 'ae54b2406b634a6d13a55e170444fd59330670cd1ea898763111c7d8e7d63bb7  performance-update.zip' | sha256sum --check
          unzip -q -o performance-update.zip -d .
          git add -- src tools README.md package.json
          git rm -- performance-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize animation rendering for mobile and desktop"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Check animation scheduling and scene transitions
        run: npm test

      - name: Build (TypeScript check + Vite)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
